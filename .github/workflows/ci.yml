name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    ruff-format:
        name: Ruff format
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python dev environment
              uses: ./.github/actions/setup-python-dev

            - name: Check formatting with ruff
              run: |
                  ruff format --check .

    ruff-lint:
        name: Ruff lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python dev environment
              uses: ./.github/actions/setup-python-dev

            - name: Lint with ruff
              run: |
                  ruff check .

    mypy:
        name: Mypy
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python dev environment
              uses: ./.github/actions/setup-python-dev

            - name: Check types with mypy
              run: |
                  mypy --no-site-packages --config-file mypy.ini  . | mypy-baseline filter

    public-api:
        name: Public API snapshot
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python dev environment
              uses: ./.github/actions/setup-python-dev

            - name: Check public API snapshot
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv run --extra dev --with pytest --with pytest-timeout python .github/scripts/test_check_public_api.py
                  make public_api_check

    strict-type-smoke:
        name: Strict type smoke
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python 3.11
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: 3.11

            - name: Check strict downstream Pyright usage
              run: .github/scripts/check_strict_types.sh

    package-build:
        name: Package build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python 3.11
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: 3.11

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.4"
                  enable-cache: true

            - name: Build and verify distributions
              run: |
                  uv build
                  uv run --with twine twine check dist/*

    tests:
        name: Python ${{ matrix.python-version }} tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.4"
                  enable-cache: true

            - name: Install test dependencies
              shell: bash
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --extra test

            - name: Run posthog tests
              run: |
                  pytest --verbose --timeout=30

    tests-mcp:
        # The MCP suite as a named gate per MCP Python SDK major. The v1 leg uses
        # the lockfile's mcp 1.x (also exercised incidentally by the `tests`
        # matrix — this leg exists as an explicit, named signal); the v2 leg
        # (spec 2026-07-28) swaps in mcp>=2 and standalone FastMCP 4, which uses
        # the v2 registry. The v1-fastmcp2 leg keeps mcp 1.x and swaps in
        # standalone FastMCP 2, which dispatches tools without a public
        # call_tool. The v2-bare leg runs mcp>=2 without FastMCP: importing
        # FastMCP 4 patches camelCase properties onto mcp_types models for the
        # whole process, which hides reads that plain mcp 2.x rejects.
        # posthog/test/mcp/conftest.py splits collection by major.
        name: MCP SDK ${{ matrix.mcp-major }} (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            matrix:
                python-version: ['3.10', '3.14']
                mcp-major: ['v1', 'v1-fastmcp2', 'v2', 'v2-bare']
                include:
                    - mcp-major: 'v1-fastmcp2'
                      mcp-packages: "'mcp>=1.28.1,<2' 'fastmcp>=2,<3'"
                    - mcp-major: 'v2'
                      mcp-packages: "'mcp>=2,<3' 'fastmcp>=4,<5'"
                    - mcp-major: 'v2-bare'
                      mcp-packages: "'mcp>=2,<3'"

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.4"
                  enable-cache: true

            - name: Install test dependencies
              shell: bash
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --extra test

            - name: Swap in MCP packages
              if: matrix.mcp-major != 'v1'
              shell: bash
              run: |
                  uv pip uninstall --python "$pythonLocation" fastmcp
                  uv pip install --python "$pythonLocation" ${{ matrix.mcp-packages }}

            - name: Run MCP tests against SDK ${{ matrix.mcp-major }}
              run: |
                  pytest posthog/test/mcp --verbose --timeout=30

    utils-quality:
        name: Utils quality
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Check utils quality inputs changed
              id: changes
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      base="${{ github.event.pull_request.base.sha }}"
                      head="${{ github.event.pull_request.head.sha }}"
                  else
                      base="${{ github.event.before }}"
                      head="${{ github.sha }}"
                  fi

                  changed_files="$(git diff --name-only "$base" "$head" -- \
                      posthog/utils.py \
                      posthog/test/test_utils.py \
                      posthog/test/test_size_limited_dict.py \
                      .github/scripts/check_crap_threshold.py \
                      .github/scripts/test_check_crap_threshold.py \
                      .github/workflows/ci.yml \
                      pyproject.toml \
                      uv.lock)"

                  if [[ -n "$changed_files" ]]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      echo "Utils quality inputs changed:"
                      echo "$changed_files"
                  else
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "Skipping utils quality check: inputs unchanged."
                  fi

            - name: Set up Python 3.11
              if: steps.changes.outputs.changed == 'true'
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: 3.11

            - name: Install uv
              if: steps.changes.outputs.changed == 'true'
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.4"
                  enable-cache: true

            - name: Check utils CRAP score
              if: steps.changes.outputs.changed == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv run --extra test --with pytest-crap --with pytest-cov pytest .github/scripts/test_check_crap_threshold.py --timeout=30 -q
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv run --extra test --with pytest-crap --with pytest-cov pytest posthog/test/test_utils.py posthog/test/test_size_limited_dict.py --timeout=30 --cov=posthog.utils -q
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv run --extra test --with pytest-crap --with pytest-cov python .github/scripts/check_crap_threshold.py posthog/utils.py --max-crap 10

    import-check:
        name: Python ${{ matrix.python-version }} import check
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install posthog
              run: pip install .

            - name: Check import produces no warnings
              run: python -W error -c "import posthog"

    openfeature-provider:
        name: OpenFeature provider Python ${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.4"
                  enable-cache: true

            # openfeature-provider-posthog is a uv workspace member (declared in
            # the root pyproject), so commands are scoped to it with --package and
            # builds are pinned to its own dist/ with --out-dir.
            - name: Install provider dependencies
              shell: bash
              working-directory: openfeature-provider
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --package openfeature-provider-posthog --extra dev

            - name: Run provider tests
              working-directory: openfeature-provider
              run: |
                  uv run --package openfeature-provider-posthog pytest --verbose

            - name: Lint and type-check provider
              working-directory: openfeature-provider
              run: |
                  uv run --package openfeature-provider-posthog ruff format --check .
                  uv run --package openfeature-provider-posthog ruff check .
                  uv run --package openfeature-provider-posthog mypy .

            - name: Build and verify provider distribution
              working-directory: openfeature-provider
              run: |
                  uv build --package openfeature-provider-posthog --out-dir dist
                  uv run --with twine twine check dist/*

            - name: Smoke test built wheel in a clean environment
              working-directory: openfeature-provider
              shell: bash
              run: |
                  uv venv /tmp/of-smoke
                  uv pip install --python /tmp/of-smoke/bin/python dist/*.whl
                  /tmp/of-smoke/bin/python -c "from openfeature.contrib.provider.posthog import PostHogProvider; print(PostHogProvider)"

    django5-integration:
        name: Django 5 integration tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: Set up Python 3.12
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: 3.12

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.4"
                  enable-cache: true

            - name: Install Django 5 test project dependencies
              shell: bash
              working-directory: integration_tests/django5
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync

            - name: Run Django 5 middleware integration tests
              working-directory: integration_tests/django5
              run: |
                  uv run pytest test_middleware.py test_exception_capture.py --verbose
