name: "PostHog Upgrade"

on:
  workflow_dispatch:
    inputs:
      package_name:
        type: choice
        description: "Package name to upgrade"
        required: true
        options:
          - posthoganalytics
      package_version:
        description: "Package version to upgrade to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: posthog-upgrade-${{ github.event.inputs.package_name }}
  cancel-in-progress: false

jobs:
  posthog-upgrade:
    name: Upgrade PostHog package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get upgrader token
        id: upgrader
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: ${{ secrets.GH_APP_POSTHOG_JS_UPGRADER_APP_ID }}
          private_key: ${{ secrets.GH_APP_POSTHOG_JS_UPGRADER_PRIVATE_KEY }}

      - name: Check out main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "PostHog/posthog"
          token: ${{ steps.upgrader.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Install new package version in main repo
        shell: bash
        env:
          RETRY_TIMES: 20
          RETRY_WAIT_SECONDS: 5
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          PACKAGE_VERSION: ${{ github.event.inputs.package_version }}
        run: |
          for i in $(seq 1 "$RETRY_TIMES"); do
              # Retry because the PyPI index is eventually consistent.
              if uv add --no-sync --refresh-package "$PACKAGE_NAME" "$PACKAGE_NAME==$PACKAGE_VERSION" && \
                  (cd services/llm-gateway && uv add --no-sync --refresh-package "$PACKAGE_NAME" "$PACKAGE_NAME>=$PACKAGE_VERSION"); then
                  break
              else
                  if [ "$i" -eq "$RETRY_TIMES" ]; then
                      exit 1
                  fi
                  sleep "$RETRY_WAIT_SECONDS"
              fi
          done

          sed -i "s/^posthoganalytics==.*/posthoganalytics==$PACKAGE_VERSION/" common/ingestion/acceptance_tests/requirements.txt
          sed -i "s/^posthog>=.*/posthog>=$PACKAGE_VERSION/" tools/infra-scripts/clitools/requirements.txt

          expected_files=(
              pyproject.toml
              uv.lock
              services/llm-gateway/pyproject.toml
              services/llm-gateway/uv.lock
              common/ingestion/acceptance_tests/requirements.txt
              tools/infra-scripts/clitools/requirements.txt
          )
          for file in "${expected_files[@]}"; do
              if git diff --quiet -- "$file"; then
                  echo "Failed to update $file to $PACKAGE_VERSION" >&2
                  exit 1
              fi
          done

      - name: Generate pull request details
        id: generate-pr-details
        shell: bash
        env:
          GH_TOKEN: ${{ steps.upgrader.outputs.token }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          PACKAGE_VERSION: ${{ github.event.inputs.package_version }}
        run: |
          TITLE_PREFIX="chore(deps): update ${PACKAGE_NAME} to "

          skip_update() {
              echo "::notice::$1"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
          }

          # Serialize writers and reject stale reruns using Python package ordering.
          check_version() {
              local current_title="$1" current_version older
              if [[ "$current_title" != "$TITLE_PREFIX"* ]]; then
                  echo "::error::Cannot determine the destination PR's package version." >&2
                  exit 1
              fi
              current_version="${current_title#"$TITLE_PREFIX"}"
              older=$(uv run --no-project --with packaging==25.0 python - "$PACKAGE_VERSION" "$current_version" <<'PY'
          import sys
          from packaging.version import Version

          print("true" if Version(sys.argv[1]) < Version(sys.argv[2]) else "false")
          PY
              ) || {
                  echo "::error::Cannot compare package versions; leaving remote branches unchanged." >&2
                  exit 1
              }
              if [ "$older" = "true" ]; then
                  skip_update "Version $PACKAGE_VERSION is older than PR version $current_version; leaving it unchanged."
              fi
          }

          queue_status() {
              local pr="$1" status
              if status=$(gh api "repos/PostHog/posthog/issues/${pr}/comments?per_page=100" \
                  --paginate --slurp \
                  --jq '[.[][] | select(.user.login == "trunk-io[bot]") | .body] | last // ""'); then
                  printf '%s' "$status" \
                      | grep -oE "Running tests on this pull request|waiting to start tests" | head -n 1 || true
              else
                  echo "::warning::Could not read the queue status of PR #${pr}; treating it as queued." >&2
                  echo "unknown"
              fi
          }

          EXISTING=$(gh pr list \
              --repo PostHog/posthog \
              --state open \
              --search "\"${TITLE_PREFIX}\" in:title sort:created-desc" \
              --limit 100 \
              --json title,number,headRefName,headRepositoryOwner \
              --jq ".[] | select(.title | startswith(\"${TITLE_PREFIX}\")) | select(.headRepositoryOwner.login == \"PostHog\") | [.number, .headRefName, .title] | @tsv" | head -n 1)
          IFS=$'\t' read -r EXISTING_PR EXISTING_BRANCH EXISTING_TITLE <<< "$EXISTING"

          # Updating a queued PR's branch restarts the merge queue's checks.
          # Leave queued PRs alone, including when their status cannot be read.
          QUEUED=""
          if [ -n "$EXISTING_PR" ]; then
              check_version "$EXISTING_TITLE"
              QUEUED=$(queue_status "$EXISTING_PR")
          fi

          if [ -n "$EXISTING_BRANCH" ] && [ -z "$QUEUED" ]; then
              BRANCH_NAME="$EXISTING_BRANCH"
          elif [ -n "$QUEUED" ]; then
              echo "::notice::PR #${EXISTING_PR} is in the merge queue; checking a separate branch instead."
              BRANCH_NAME="${PACKAGE_NAME}-upgrade-${PACKAGE_VERSION}"
              # A rerun can collide with an already queued version-specific PR.
              if ! DESTINATIONS=$(gh pr list \
                  --repo PostHog/posthog \
                  --state open \
                  --head "$BRANCH_NAME" \
                  --limit 100 \
                  --json title,number,headRefName,isCrossRepository \
                  --jq '.[] | select(.isCrossRepository == false) | [.number, .headRefName, .title] | @tsv'); then
                  skip_update "Could not check the fallback branch for an existing PR; leaving it unchanged."
              fi
              while IFS=$'\t' read -r DESTINATION_PR DESTINATION_BRANCH DESTINATION_TITLE; do
                  [ -n "$DESTINATION_PR" ] || continue
                  [ "$DESTINATION_BRANCH" = "$BRANCH_NAME" ] || continue
                  check_version "$DESTINATION_TITLE"
                  if [ -n "$(queue_status "$DESTINATION_PR")" ]; then
                      skip_update "Fallback PR #${DESTINATION_PR} is queued or its status is unknown; leaving it unchanged."
                  fi
              done <<< "$DESTINATIONS"
          else
              BRANCH_NAME="${PACKAGE_NAME}-upgrade"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE_PREFIX}${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          {
              echo 'body<<EOF'
              echo '## Changes'
              echo
              echo "PostHog Python SDK version $PACKAGE_VERSION has been released. This updates the \`posthoganalytics\` and \`posthog\` dependency declarations to the same SDK version."
              echo
              echo '[GitHub releases](https://github.com/PostHog/posthog-python/releases) • [`posthoganalytics` on PyPI](https://pypi.org/project/posthoganalytics/#history) • [`posthog` on PyPI](https://pypi.org/project/posthog/#history)'
              echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create main repo pull request
        if: steps.generate-pr-details.outputs.skip == 'false'
        id: main-repo-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          HUSKY: "0"
        with:
          token: ${{ steps.upgrader.outputs.token }}
          # PostHog/posthog requires signed commits, so commit through the GitHub API.
          sign-commits: true
          commit-message: ${{ steps.generate-pr-details.outputs.title }}
          branch: ${{ steps.generate-pr-details.outputs.branch_name }}
          delete-branch: true
          title: ${{ steps.generate-pr-details.outputs.title }}
          body: ${{ steps.generate-pr-details.outputs.body }}

      - name: Output pull request result
        if: steps.generate-pr-details.outputs.skip == 'false'
        shell: bash
        env:
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          PACKAGE_VERSION: ${{ github.event.inputs.package_version }}
          PR_URL: ${{ steps.main-repo-pr.outputs.pull-request-url }}
        run: |
          echo "PostHog pull request for $PACKAGE_NAME version $PACKAGE_VERSION ready: $PR_URL"

      - name: Update pull request metadata
        if: steps.generate-pr-details.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.upgrader.outputs.token }}
          PR_BODY: ${{ steps.generate-pr-details.outputs.body }}
          PR_NUMBER: ${{ steps.main-repo-pr.outputs.pull-request-number }}
          PR_TITLE: ${{ steps.generate-pr-details.outputs.title }}
        run: |
          gh pr edit "$PR_NUMBER" \
              --repo PostHog/posthog \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

      - name: Assign reviewers
        if: steps.generate-pr-details.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.upgrader.outputs.token }}
          PR_NUMBER: ${{ steps.main-repo-pr.outputs.pull-request-number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo PostHog/posthog --add-reviewer PostHog/client-libraries-approvers --add-reviewer PostHog/team-client-libraries

      # https://us.posthog.com/project/11213/functions/019ae9c0-03ee-0000-2f32-971f64be8ffe
      - name: Send failure event to PostHog
        if: ${{ failure() }}
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: "${{ secrets.POSTHOG_PROJECT_API_KEY }}"
          event: "posthog-sdk-github-release-workflow-failure"
          properties: >-
            {
              "commitSha": "${{ github.sha }}",
              "jobStatus": "${{ job.status }}",
              "ref": "${{ github.ref }}",
              "repository": "PostHog/posthog",
              "sdk": "posthog-python",
              "jobName": "posthog-upgrade",
              "packageName": "${{ github.event.inputs.package_name }}",
              "packageVersion": "${{ github.event.inputs.package_version }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": ":rotating_light: Failed to open the PostHog upgrade PR for posthoganalytics@${{ github.event.inputs.package_version }} :rotating_light:",
              "alertContext": "The posthog-upgrade workflow failed before completion."
            }
