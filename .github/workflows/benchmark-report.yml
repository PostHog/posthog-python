name: Python SDK benchmark report

on:
    workflow_run:
        workflows: ['Python SDK benchmarks']
        types: [completed]

permissions: {}

jobs:
    report:
        permissions:
            contents: read
            actions: read
            pull-requests: write
        uses: PostHog/.github/.github/workflows/sdk-benchmark-report.yml@ced4b9694b90c9221bc277b1c8d9f013eafe56c5 # SDK benchmark workflow (PostHog/.github PR #84)
        with:
            workflow-path: .github/workflows/benchmarks.yml
            artifact-name: python-benchmark-results
            report-key: posthog-python
            sdk: posthog-python
