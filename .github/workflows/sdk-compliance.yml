name: SDK Compliance Tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  adapter-tests:
    name: Compliance adapter protocol tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install adapter and test dependencies
        run: python -m pip install -e . -r sdk_compliance_adapter/requirements.txt pytest pytest-timeout pytest-asyncio
      - name: Test adapter protocol
        run: python -m pytest sdk_compliance_adapter/test_adapter.py --timeout=30

  compliance:
    # The harness has one enable_compression flag but a test per codec, so each
    # job runs the adapter with one codec. The reusable harness workflow cannot
    # pass the COMPRESSION env var, so this job runs the containers directly.
    # The SDK has no brotli support, so there is no br job.
    name: PostHog SDK compliance tests (${{ matrix.compression }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compression: [gzip, deflate, zstd]
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.compression }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      HARNESS_IMAGE: ghcr.io/posthog/sdk-test-harness:1.13.1
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull test harness
        run: docker pull "$HARNESS_IMAGE"

      - name: Build SDK adapter
        run: docker build -f sdk_compliance_adapter/Dockerfile -t sdk-adapter:test .

      - name: Start SDK adapter
        run: |
          docker network create test-network
          docker run -d \
            --name sdk-adapter \
            --network test-network \
            -e COMPRESSION=${{ matrix.compression }} \
            sdk-adapter:test

      - name: Run compliance suite
        run: |
          mkdir -p report
          docker run --rm \
            --name test-harness \
            --network test-network \
            -v "${GITHUB_WORKSPACE}/report:/report" \
            "$HARNESS_IMAGE" \
            run \
            --adapter-url http://sdk-adapter:8080 \
            --mock-url http://test-harness:8081 \
            --output text \
            --report /report/sdk-compliance-report.md \
            --sdk-type server

      - name: Publish report to the job summary
        if: always()
        run: |
          if [ -f report/sdk-compliance-report.md ]; then
            cat report/sdk-compliance-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-compliance-report-${{ matrix.compression }}
          path: report/sdk-compliance-report.md

      - name: Show adapter logs on failure
        if: failure()
        run: docker logs sdk-adapter || true

      - name: Stop containers
        if: always()
        run: |
          docker rm -f sdk-adapter || true
          docker network rm test-network || true
