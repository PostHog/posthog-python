version: "3.8"

services:
  # PostHog Python SDK adapter
  sdk-adapter:
    build:
      context: ..
      dockerfile: sdk_compliance_adapter/Dockerfile
    environment:
      # One of gzip, deflate or zstd; selects the encoding_<codec> test.
      COMPRESSION: ${COMPRESSION:-gzip}
    ports:
      - "8080:8080"
    networks:
      - test-network

  # Test harness
  test-harness:
    image: ghcr.io/posthog/sdk-test-harness:1.34.0@sha256:43f75861fbcf5bc6c3d35511caa2be2d55274054c6071ebeb943aca0bcd0633a
    command: ["run", "--adapter-url", "http://sdk-adapter:8080", "--mock-url", "http://test-harness:8081"]
    networks:
      - test-network
    depends_on:
      - sdk-adapter

networks:
  test-network:
    driver: bridge
